<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administrar Luz de Archivo</title>
</head>
<body>
<script>
(function () {
  // Evita choques cuando distintas sesiones exportan archivos con el mismo nombre.
  // Antes de que Sveltia procese la selección, añade automáticamente un identificador
  // único al nombre manteniendo el nombre original y la extensión.
  document.addEventListener('change', function (event) {
    const input = event.target;
    if (!(input instanceof HTMLInputElement) || input.type !== 'file' || !input.files?.length) return;
    if (input.dataset.uniqueNamesApplied === 'true') {
      delete input.dataset.uniqueNamesApplied;
      return;
    }

    const dt = new DataTransfer();
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const stamp =
      now.getFullYear() +
      pad(now.getMonth() + 1) +
      pad(now.getDate()) + '-' +
      pad(now.getHours()) +
      pad(now.getMinutes()) +
      pad(now.getSeconds());

    Array.from(input.files).forEach((file, index) => {
      const dot = file.name.lastIndexOf('.');
      const base = dot > 0 ? file.name.slice(0, dot) : file.name;
      const ext = dot > 0 ? file.name.slice(dot) : '';
      const uid = (crypto.randomUUID ? crypto.randomUUID().slice(0, 8) : Math.random().toString(36).slice(2, 10));
      const uniqueName = base + '-' + stamp + '-' + String(index + 1).padStart(2, '0') + '-' + uid + ext;
      dt.items.add(new File([file], uniqueName, {
        type: file.type,
        lastModified: file.lastModified
      }));
    });

    input.dataset.uniqueNamesApplied = 'true';
    input.files = dt.files;
  }, true);
})();
</script>
<script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>

<script id="auto-resolve-duplicate-media">
(function () {
  const normalize = s => (s || '').trim().toLowerCase();
  const resolveDuplicateDialog = () => {
    const buttons = Array.from(document.querySelectorAll('button'));
    const keepBoth = buttons.find(btn => {
      const t = normalize(btn.textContent);
      return t === 'conservar ambos' || t === 'keep both';
    });
    if (!keepBoth) return;

    const dialog = keepBoth.closest('[role="dialog"], dialog') || keepBoth.parentElement?.parentElement;
    const text = normalize(dialog?.textContent || document.body.textContent);
    const isDuplicateConflict =
      text.includes('conflictos de nombres de archivo') ||
      text.includes('ya existe un archivo llamado') ||
      text.includes('file name conflict') ||
      text.includes('already exists');

    if (isDuplicateConflict && !keepBoth.dataset.autoResolved) {
      keepBoth.dataset.autoResolved = 'true';
      keepBoth.click();
    }
  };

  const observer = new MutationObserver(resolveDuplicateDialog);
  observer.observe(document.documentElement, { childList: true, subtree: true, characterData: true });
  document.addEventListener('click', () => setTimeout(resolveDuplicateDialog, 50), true);
  setInterval(resolveDuplicateDialog, 500);
})();
</script>
</body>
</html>

# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: michellecr/portafolio
  branch: main
  auth_methods: [token]

site_url: https://michellecr.github.io/portafolio/
display_url: https://michellecr.github.io/portafolio/
media_folder: /uploads
public_folder: /portafolio/uploads
media_libraries:
  default:
    config:
      slugify_filename: true

collections:
  - name: home
    label: Inicio
    files:
      - name: home
        label: Fotografías del inicio
        file: content/home.json
        fields:
          - {label: Fotografía principal, name: hero, widget: image}
          - {label: Texto alternativo principal, name: hero_alt, widget: string, required: false}
          - {label: Fotografía de la fotógrafa, name: photographer, widget: image}
          - {label: Texto alternativo fotógrafa, name: photographer_alt, widget: string, required: false}

  - name: portfolio
    label: Portfolio
    files:
      - name: groups
        label: Grupos y fotografías
        file: content/portfolio.json
        fields:
          - label: Grupos
            name: groups
            widget: list
            summary: '{{fields.title}}'
            fields:
              - {label: Título, name: title, widget: string}
              - {label: Visible, name: visible, widget: boolean, default: true}
              - {label: Foto de portada, name: cover, widget: image}
              - label: Fotografías
                name: photos
                widget: list
                fields:
                  - {label: Imagen, name: image, widget: image}
                  - {label: Título opcional, name: title, widget: string, required: false}
